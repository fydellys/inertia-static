# A "CDN" in front of the app: nginx proxy_cache honouring X-Accel-Expires
# (emitted by the inertia-static "nginx" driver).
proxy_cache_path /var/cache/nginx/inertia levels=1:2 keys_zone=inertia:20m max_size=200m inactive=1h use_temp_path=off;

# Only store what the app explicitly marks as shared-cacheable
# (X-Inertia-Static-Cache: cacheable). Same idea as a Cloudflare
# Cache Response Rule: no-store unless the header equals "cacheable".
map $upstream_http_x_inertia_static_cache $not_cacheable_by_app {
    default   1;
    cacheable 0;
}

proxy_cache inertia;
proxy_cache_key "$host$request_uri";
proxy_cache_lock on;
proxy_cache_revalidate on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
proxy_cache_background_update on;
# Preview mode cookie: always skip the cache (and never store the preview).
proxy_cache_bypass $http_authorization $cookie_inertia_static_preview;
proxy_no_cache $http_authorization $not_cacheable_by_app $cookie_inertia_static_preview;

server {
    listen 8088;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Exposed to JS: HIT/MISS of the CDN for the initial HTML document.
    add_header Server-Timing 'cdn;desc="$upstream_cache_status"' always;
    add_header X-Cache-Status $upstream_cache_status always;

    location / {
        proxy_pass http://app:8000;
    }

    # ngx_cache_purge: GET /purge/blog/post-1  or  /purge/blog*  (prefix wildcard).
    # Used by the inertia-static "nginx" driver; only reachable from the app.
    location ~ ^/purge(/.*)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_cache_purge inertia "$host$1$is_args$args";
    }

    # Hostile CDN / static host: drops the X-Inertia response header of the
    # page JSON (the trigger of inertiajs/inertia#1923). The client plugin
    # must still produce valid Inertia visits.
    location /__inertia/ {
        proxy_pass http://app:8000;
        proxy_hide_header X-Inertia;
    }
}
